name: SteadySteps
options:
  bundleIdPrefix: com.steadysteps
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  SteadySteps:
    type: application
    platform: iOS
    sources:
      - path: SteadySteps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.steadysteps.personal
        INFOPLIST_KEY_CFBundleDisplayName: Lego Bob Official Fitness App
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
schemes:
  SteadySteps:
    build:
      targets:
        SteadySteps: all
